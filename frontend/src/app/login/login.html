<div class="page-center">
  <div class="w-full max-w-md card card-body">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 mb-4">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">3SV</h1>
      <p class="text-slate-500 text-sm sm:text-base">Connectez-vous à votre espace</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-4 alert alert-error text-center">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="username" class="label">Nom d'utilisateur ou e-mail</label>
        <input type="text" id="username" formControlName="username" class="input" placeholder="ex. vendeur1 ou prenom@mail.com" autocomplete="username">
      </div>

      <div>
        <label for="password" class="label">Mot de passe</label>
        <input type="password" id="password" formControlName="password" class="input" placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="w-full btn btn-primary shadow disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isLoading()) {
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Connexion...
        } @else {
          Se connecter
        }
      </button>
    </form>
  </div>
</div>
